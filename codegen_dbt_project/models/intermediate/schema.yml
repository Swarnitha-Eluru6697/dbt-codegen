version: 2

models:
  - name: int_employees_enriched
    description: >
      Intermediate model that enriches stg_employees with a tenure_years
      derived column. Serves as the single enriched employee grain for
      downstream marts.
    columns:
      - name: emp_id
        description: "Primary key – unique identifier for each employee."
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Employee's first name."
        tests:
          - not_null

      - name: last_name
        description: "Employee's last name."
        tests:
          - not_null

      - name: joining_date
        description: "Date the employee was hired."
        tests:
          - not_null

      - name: salary
        description: "Employee's current salary."

      - name: city
        description: "city"

      - name: department_id
        description: "Foreign key to the departments dimension."



version: 2

sources:
  - name: public
    database: workspace
    schema: public
    tables:
      - name: employees

models:
  - name: stg_employees
    description: "Staged employees data cleaned and renamed from the raw public.employees table."
    columns:
      - name: employee_id
        description: "Primary key – unique identifier for each employee."
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Employee's first name."
        tests:
          - not_null

      - name: last_name
        description: "Employee's last name."
        tests:
          - not_null

      - name: email
        description: "Employee's email address."
        tests:
          - not_null
          - unique

      - name: phone_number
        description: "Employee's contact phone number."

      - name: hire_date
        description: "Date the employee was hired."
        tests:
          - not_null

      - name: job_id
        description: "Foreign key to the jobs table."

      - name: salary
        description: "Employee's current salary."

      - name: manager_id
        description: "Foreign key referencing the manager's employee_id."

      - name: department_id
        description: "Foreign key referencing the department."

      - name: created_at
        description: "Timestamp when the record was created."

      - name: updated_at
        description: "Timestamp when the record was last updated."
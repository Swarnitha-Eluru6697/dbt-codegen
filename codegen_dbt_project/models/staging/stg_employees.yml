version: 2

sources:
  - name: public
    database: workspace
    schema: public
    tables:
      - name: employees

models:
  - name: stg_employees
    description: "Staged employees data cleaned and renamed from the raw public.employees table."
    columns:
      - name: emp_id
        description: "Primary key – unique identifier for each employee."
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Employee's first name."
        tests:
          - not_null

      - name: last_name
        description: "Employee's last name."
        tests:
          - not_null

      - name: joining_date
        description: "Date the employee was hired."
        tests:
          - not_null

      - name: salary
        description: "Employee's current salary."

      - name: city
        description: "city"

      - name: department_id
        description: "Foreign key to the departments dimension."
